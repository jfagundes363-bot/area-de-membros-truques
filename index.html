<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Shim to prevent Chrome extensions (e.g., Ant Video Downloader) from throwing
      // "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : window.fetch;
          var activeFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            // Prevent noisy third-party extension failures from propagating
            event.preventDefault();
          }
        }, true);
      })();
    </script>
